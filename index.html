<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #FFF0F7;
            font-family: Arial, sans-serif;
            color: #754B68;
             cursor: none;
        }



        .header {
            width: 100%;
            height: 80px;
            padding: 0 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #FFFFFF;
            border-bottom: 1px solid #FFD1E6;

            >.logo {
                font-size: 25px;
                color: #D94D91;
                letter-spacing: 1px;

                >span {
                    color: #FF8FC7;
                }
            }

            >.hamburger {
                width: 48px;
                height: 48px;
                border: 1px solid #FFB5D8;
                border-radius: 15px;
                background: #FFF0F7;

                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 6px;

                cursor: pointer;
                transition: .3s;
                 cursor: none;

                >span {
                    width: 23px;
                    height: 3px;
                    background: #FF8FC7;
                    border-radius: 10px;
                }

                &:hover {
                    background: #FFE0EF;
                    box-shadow: 0 0 15px #FF8FC780;
                }
            }
        }



        .side-menu {
            display: none;
            width: 280px;
            padding: 25px;

            position: absolute;
            top: 80px;
            right: 7%;

            background: #FFFFFF;
            border: 1px solid #FFD1E6;
            border-radius: 18px;
            box-shadow: 0 8px 25px #D94D911A;
             cursor: none;

            >h3 {
                color: #D94D91;
                margin-bottom: 20px;
                font-size: 16px;
            }

            >ul {
                list-style: none;

                >li {
                    margin-bottom: 10px;

                    >a {
                        display: block;
                        padding: 12px;
                        text-decoration: none;
                        color: #754B68;
                        border-radius: 10px;
                        transition: .3s;
                         cursor: none;

                        &:hover {
                            background: #FFF0F7;
                            color: #D94D91;
                            padding-left: 20px;
                        }
                    }
                }
            }
        }


        .side-menu.active {
            display: block;
        }

        .custom-cursor {
            width: 28px;
            height: 28px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #FF69B4;
            font-size: 28px;

            pointer-events: none;
            user-select: none;

            text-shadow: 0 0 8px #FFB6D9;
            transform: translate(-50%, -50%);
        }

        .custom-cursor.clicked {
            color: #FF1493;
            text-shadow:
                0 0 5px #FF69B4,
                0 0 10px #FF69B4,
                0 0 20px #FF1493,
                0 0 35px #FF69B4;

            -webkit-text-stroke: 1.5px #FF1493;

            transform: translate(-50%, -50%) scale(1.3);
        }




        .sparkle {
            position: fixed;
            z-index: 9998;
            pointer-events: none;
            user-select: none;

            color: #FF8FC7;
            font-size: 18px;

            text-shadow:
                0 0 5px #FFB6D9,
                0 0 10px #FF69B4,
                0 0 18px #FF69B4;

            transform: translate(-50%, -50%);
            animation: sparkle-fade 700ms ease-out forwards;
        }

        @keyframes sparkle-fade {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -75%) scale(1.8) rotate(45deg);
            }
        }



     
/* /// Pink XO Game /// */

.game-section {
    width: 100%;
    padding: 80px 20px;
    background: linear-gradient(
        135deg,
        #FFF0F7,
        #FFE0EF,
        #FFF7FB
    );
    font-family: Arial, sans-serif;
}

.game-container {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 35px 25px;

    background: #FFFFFF;
    border: 1px solid #FFD1E6;
    border-radius: 28px;

    text-align: center;

    box-shadow:
        0 10px 35px #D94D911A,
        0 0 20px #FF8FC71A;
}

.game-title {
    margin-bottom: 10px;
    color: #D94D91;
    font-size: 36px;
    font-weight: 800;
    text-shadow: 0 0 12px #FF8FC755;
}

.game-description {
    margin-bottom: 25px;
    color: #A16B8B;
    font-size: 14px;
}

.game-status {
    margin-bottom: 20px;
    color: #D94D91;
    font-size: 17px;
    font-weight: 700;
}

.game-board {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;

    width: 100%;
    max-width: 330px;
    margin: 0 auto 25px;
}

.game-cell {
    aspect-ratio: 1 / 1;

    border: 1px solid #FFC1DF;
    border-radius: 16px;
    background: #FFF5FA;

    color: #D94D91;
    font-size: 42px;
    font-weight: 800;

    cursor: none;

    transition:
        background 0.25s,
        box-shadow 0.25s,
        transform 0.25s;
}

.game-cell:hover {
    background: #FFE5F1;
    box-shadow: 0 0 15px #FF8FC766;
    transform: scale(1.03);
}

.restart-button {
    padding: 12px 25px;

    border: none;
    border-radius: 30px;

    background: #D94D91;
    color: #FFFFFF;

    font-size: 14px;
    font-weight: 700;

    cursor: none;
    transition: 0.3s;
}

.restart-button:hover {
    background: #BD3278;
    box-shadow: 0 0 18px #FF8FC780;
    transform: translateY(-2px);
}

@media (max-width: 400px) {
    .game-container {
        padding: 28px 16px;
    }

    .game-title {
        font-size: 30px;
    }

    .game-cell {
        font-size: 34px;
    }
}




/* =========================
   PINKMAGIC XO FOOTER
   White + Pastel Pink Theme
========================= */

.xo-footer {
    --pink: #f472b6;
    --pink-light: #ffb5df;
    --pink-dark: #d63398;
    --purple: #a78bfa;
    --blue: #8ca8ff;
    --text: #513c59;

    position: relative;
    isolation: isolate;
    overflow: hidden;
    width: 100%;
    padding: 48px 20px 22px;
    margin-top: 60px;

    background: linear-gradient(
        135deg,
        #ffffff 0%,
        #fff8fc 35%,
        #fff0f8 70%,
        #ffe8f5 100%
    );

    border-top: 1px solid #ffc4e6;

    box-shadow:
        0 -5px 25px rgba(255, 114, 198, 0.12);

    color: var(--text);
    font-family: inherit;
}

/* Soft pink glow */

.xo-footer::before {
    content: "";
    position: absolute;
    z-index: -1;
    top: -110px;
    left: 50%;

    width: 340px;
    height: 180px;

    transform: translateX(-50%);

    background: #ffb5e5;
    filter: blur(100px);
    opacity: 0.45;

    pointer-events: none;
}

/* Decorative bottom glow */

.xo-footer::after {
    content: "";
    position: absolute;
    z-index: -1;
    bottom: -100px;
    left: 50%;

    width: 70%;
    height: 140px;

    transform: translateX(-50%);

    background: #fbcfe8;
    filter: blur(85px);
    opacity: 0.45;

    pointer-events: none;
}

/* =========================
   FOOTER LAYOUT
========================= */

.footer-content {
    position: relative;
    z-index: 2;

    width: 100%;
    max-width: 1000px;
    margin: 0 auto;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
    flex-wrap: wrap;
}

/* =========================
   PROFILE
========================= */

.footer-profile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

.profile-glow {
    width: 66px;
    height: 66px;
    padding: 3px;

    border-radius: 50%;

    background: linear-gradient(
        135deg,
        var(--pink),
        var(--purple),
        var(--blue),
        var(--pink)
    );

    background-size: 250% 250%;

    box-shadow:
        0 0 10px rgba(244, 114, 182, 0.45),
        0 0 24px rgba(244, 114, 182, 0.2);

    animation:
        avatarPulse 3s ease-in-out infinite,
        gradientMove 5s ease infinite;
}

.footer-avatar {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
    border-radius: 50%;

    border: 2px solid #fff;
}

/* Your name */

.footer-name {
    margin: 2px 0 0;

    color: var(--pink-dark);

    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.5px;

    transition:
        color 0.3s ease,
        text-shadow 0.3s ease;
}

.footer-name:hover {
    color: #ec4899;

    text-shadow:
        0 0 8px rgba(244, 114, 182, 0.4);
}

/* Caption */

.footer-caption {
    margin: 0;

    color: #907b98;
    font-size: 11px;
    text-align: center;
}

.pink-heart {
    display: inline-block;

    color: #f472b6;

    animation: heartBeat 1.3s ease-in-out infinite;
}

/* =========================
   XO LOGO
========================= */

.footer-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
}

.logo-x,
.logo-o {
    font-size: 43px;
    font-weight: 900;
    line-height: 1;

    animation: logoFloat 3s ease-in-out infinite;
}

.logo-x {
    color: #ed70bb;

    text-shadow:
        0 3px 0 #fbd0e9,
        0 0 12px rgba(244, 114, 182, 0.4);
}

.logo-o {
    color: #8ca8ff;

    text-shadow:
        0 3px 0 #dbe4ff,
        0 0 12px rgba(140, 168, 255, 0.4);

    animation-delay: 0.5s;
}

.footer-logo p {
    flex-basis: 100%;

    margin: 0;

    color: #c05ba3;

    font-size: 10px;
    font-weight: 900;
    text-align: center;
    letter-spacing: 4px;
}

/* =========================
   SOCIAL ICONS
========================= */

.footer-socials {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 13px;
    
}

.social-link {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    width: 43px;
    height: 43px;

    color: #b64a9a;
    font-size: 19px;

    text-decoration: none;

    border: 1px solid rgba(230, 126, 190, 0.4);
    border-radius: 14px;

    background: rgba(255, 255, 255, 0.8);

    box-shadow:
        0 3px 10px rgba(225, 130, 185, 0.08);

    transition:
        color 0.3s ease,
        background 0.3s ease,
        border-color 0.3s ease,
        transform 0.3s ease,
        box-shadow 0.3s ease;

        cursor: none;
}

/* Pink neon hover */

.social-link:hover {
    color: #fff;

    background: #f17bc4;
    border-color: #f17bc4;

    transform: translateY(-5px) scale(1.07);

    box-shadow:
        0 0 10px rgba(255, 114, 198, 0.55),
        0 0 22px rgba(255, 114, 198, 0.3),
        0 5px 12px rgba(214, 51, 152, 0.12);
}

/* Keyboard accessibility */

.social-link:focus-visible {
    outline: 2px solid #ec4899;
    outline-offset: 4px;
}

/* Click animation */

.social-link:active {
    transform: scale(0.94);
}

/* =========================
   FLOATING XO DECORATIONS
========================= */

.footer-symbol {
    position: absolute;
    z-index: 0;

    pointer-events: none;
    user-select: none;

    animation: symbolFloat 5s ease-in-out infinite;
}

.symbol-one {
    top: 25px;
    left: 6%;

    font-size: 42px;
    font-weight: 900;

    color: #f472b6;
    opacity: 0.32;
}

.symbol-two {
    top: 50px;
    right: 7%;

    font-size: 48px;
    font-weight: 900;

    color: #8ca8ff;
    opacity: 0.4;

    animation-delay: 1s;
}

.symbol-three {
    top: 25%;
    left: 22%;

    font-size: 17px;
    color: #ec4899;
    opacity: 0.7;

    animation-delay: 0.7s;
}

.symbol-four {
    top: 20%;
    right: 24%;

    font-size: 22px;
    color: #a78bfa;

    animation-delay: 1.5s;
}

.symbol-five {
    bottom: 20%;
    right: 12%;

    font-size: 27px;
    color: #f472b6;
    opacity: 0.65;

    animation-delay: 2s;
}



/* =========================
   ANIMATIONS
========================= */

@keyframes avatarPulse {
    0%, 100% {
        box-shadow:
            0 0 10px rgba(244, 114, 182, 0.35),
            0 0 20px rgba(244, 114, 182, 0.12);
    }

    50% {
        box-shadow:
            0 0 17px rgba(244, 114, 182, 0.7),
            0 0 32px rgba(244, 114, 182, 0.28);
    }
}

@keyframes gradientMove {
    0%, 100% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }
}

@keyframes heartBeat {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.2);
    }
}

@keyframes logoFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-4px);
    }
}

@keyframes symbolFloat {
    0%, 100% {
        transform: translateY(0) rotate(-5deg);
    }

    50% {
        transform: translateY(-12px) rotate(8deg);
    }
}

/* =========================
   RESPONSIVE DESIGN
========================= */

@media (max-width: 650px) {

/* Smaller mobile screens */

@media (max-width: 360px) {
    .footer-socials {

    }

/* Accessibility: reduced motion */

@media (prefers-reduced-motion: reduce) {
    .xo-footer *,
    .xo-footer *::before,
    .xo-footer *::after {
        animation: none !important;
        transition: none !important;
    }
}

/* /// Pink XO Game /// */

// 1. Select HTML elements

const cells = document.querySelectorAll('.game-cell')
const statusText = document.querySelector('.game-status')
const restartButton = document.querySelector('.restart-button')

// 2. Game variables

let board = ['', '', '', '', '', '', '', '', '']
let gameActive = true
let playerTurn = true

// 3. Winning combinations

const winningCombinations = [
    [0, 1, 2],
    [3, 4, 5],
    [6, 7, 8],

    [0, 3, 6],
    [1, 4, 7],
    [2, 5, 8],

    [0, 4, 8],
    [2, 4, 6]
]

// 4. Player clicks a cell

cells.forEach((cell, index) => {

    cell.addEventListener('click', () => {

        if (board[index] !== '' || !gameActive || !playerTurn) {
            return
        }

        board[index] = 'X'
        cell.textContent = 'X'

        checkWinner()

        if (!gameActive) {
            return
        }

        playerTurn = false
        statusText.textContent = "Computer's turn, O!"

        setTimeout(() => {
            computerMove()
        }, 500)

    })

})

// 5. Computer chooses a random empty cell

function computerMove() {

    if (!gameActive) {
        return
    }

    let emptyCells = []

    board.forEach((value, index) => {
        if (value === '') {
            emptyCells.push(index)
        }
    })

    if (emptyCells.length === 0) {
        checkWinner()
        return
    }

    let randomIndex = Math.floor(Math.random() * emptyCells.length)
    let computerChoice = emptyCells[randomIndex]

    board[computerChoice] = 'O'
    cells[computerChoice].textContent = 'O'

    checkWinner()

    if (gameActive) {
        playerTurn = true
        statusText.textContent = 'Your turn, X!'
    }

}

// 6. Check winner or draw

function checkWinner() {

    for (let combination of winningCombinations) {

        let a = combination[0]
        let b = combination[1]
        let c = combination[2]

        if (
            board[a] !== '' &&
            board[a] === board[b] &&
            board[a] === board[c]
        ) {

            gameActive = false

            if (board[a] === 'X') {
                statusText.textContent = 'You win! ♡'
            } else {
                statusText.textContent = 'Computer wins! ♡'
            }

            return
        }

    }

    if (!board.includes('')) {
        gameActive = false
        statusText.textContent = "It's a draw! ♡"
    }

}

// 7. Restart game

restartButton.addEventListener('click', () => {

    board = ['', '', '', '', '', '', '', '', '']
    gameActive = true
    playerTurn = true

    cells.forEach((cell) => {
        cell.textContent = ''
    })

    statusText.textContent = 'Your turn, X!'

})





    </script>
